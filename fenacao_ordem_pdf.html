var app = document.getElementById('app');
var queue, pos, answers, t0, cur, locked, optList;

function shuffle(a){
  a = a.slice();
  for(var i=a.length-1; i>0; i--){
    var j = Math.floor(Math.random()*(i+1));
    var x = a[i]; a[i] = a[j]; a[j] = x;
  }
  return a;
}

function start(list){
  queue = list.slice();
  pos = 0;
  answers = [];
  t0 = Date.now();
  render();
}

function render(){
  if(pos >= queue.length){ return finish(); }
  var q = queue[pos];
  cur = q;
  locked = false;
  
  var opts = [{x: q.ok, ok: true, why: ''}].concat(q.er.map(function(e){ return {x: e[0], ok: false, why: e[1]}; }));
  optList = shuffle(opts);
  var L = 'ABCD';
  
  var h = '<h1>Fenação - Curso Completo</h1>';
  h += '<p class="sub">Progressão linear na ordem dos slides (Slides 1 a 56 · Forragicultura)</p>';
  h += '<div class="meta"><span>Questão ' + (pos+1) + ' de ' + queue.length + '</span><span>' + answers.filter(function(a){return a.ok}).length + ' acertos</span></div>';
  h += '<div class="bar"><i style="width:' + (pos/queue.length*100) + '%"></i></div>';
  h += '<div class="badge">' + q.sec + '</div>';
  h += '<p class="stem">' + q.q + '</p><div id="opts">';
  
  optList.forEach(function(o, i){
    h += '<button class="opt" data-i="' + i + '"><b>' + L[i] + '</b><span>' + o.x + '</span></button>';
  });
  
  h += '</div><div id="fb"></div><p class="hint">Teclas: [1-4] escolhem a alternativa; [Enter] avança para a próxima.</p>';
  app.innerHTML = h;
  
  Array.prototype.forEach.call(app.querySelectorAll('.opt'), function(b){
    b.onclick = function(){ pick(+b.getAttribute('data-i')); };
  });
}

function pick(i){
  if(locked || !optList[i]) return;
  locked = true;
  var q = cur;
  var o = optList[i];
  
  var btns = app.querySelectorAll('.opt');
  Array.prototype.forEach.call(btns, function(b, k){
    b.disabled = true;
    if(optList[k].ok) b.classList.add('ok');
    else if(k === i) b.classList.add('ko');
  });
  
  answers.push({q: q, ok: o.ok, chosen: o.x});
  
  var f = '<div class="fb"><p class="h ' + (o.ok ? 'ok' : 'ko') + '">' + (o.ok ? 'Correto.' : 'Errado.') + '</p>';
  f += '<p><em>Tema:</em> ' + q.tema + '</p>';
  f += '<p><em>Pista no Enunciado:</em> ' + q.pista + '</p>';
  f += '<p><em>Núcleo Conceitual:</em> ' + q.nucleo + '</p>';
  if(!o.ok) {
    f += '<p><em>Por que sua escolha está incorreta:</em> ' + o.why + '</p>';
  }
  f += '<p><em>Contraste com outro conceito:</em> ' + q.outro + '</p>';
  f += '<p><em>Referência no PDF:</em> ' + q.ref + '</p>';
  f += '<button class="main" id="nx">' + (pos+1 >= queue.length ? 'Concluir e Ver Relatório' : 'Próxima Questão') + '</button></div>';
  
  document.getElementById('fb').innerHTML = f;
  document.getElementById('nx').onclick = next;
  document.getElementById('nx').focus();
}

function next(){
  pos++;
  render();
  window.scrollTo(0, 0);
}

document.addEventListener('keydown', function(e){
  if(!queue || pos >= queue.length) return;
  if(!locked && e.key >= '1' && e.key <= '4'){
    pick(+e.key - 1);
  } else if(locked && e.key === 'Enter'){
    e.preventDefault();
    next();
  }
});

function fmt(ms){
  var s = Math.round(ms/1000);
  return Math.floor(s/60) + ' min ' + ('0' + (s%60)).slice(-2) + ' s';
}

function finish(){
  var tot = answers.length;
  var ac = answers.filter(function(a){ return a.ok; }).length;
  var bySec = {};
  
  answers.forEach(function(a){
    var s = a.q.sec;
    bySec[s] = bySec[s] || { tot: 0, ok: 0 };
    bySec[s].tot++;
    if(a.ok) bySec[s].ok++;
  });
  
  var h = '<h1>Fechamento do Curso - Fenação</h1>';
  h += '<p class="sub">Auditoria completa do desempenho (Ordem sequencial do PDF)</p>';
  h += '<div class="score">' + (ac/tot*10).toFixed(1) + ' <span style="font-size:18px;color:var(--c-mut)">/ 10</span></div>';
  h += '<p><strong>' + ac + ' de ' + tot + '</strong> questões corretas (' + Math.round(ac/tot*100) + '%) · Tempo total: ' + fmt(Date.now() - t0) + '</p>';
  
  h += '<h2>Aproveitamento por Seção do Material</h2>';
  h += '<table><tr><th>Seção do PDF</th><th>Acertos</th><th>Aproveitamento</th></tr>';
  Object.keys(bySec).forEach(function(s){
    var st = bySec[s];
    var pct = Math.round(st.ok/st.tot*100);
    h += '<tr><td>' + s + '</td><td>' + st.ok + ' / ' + st.tot + '</td><td class="p' + (pct < 70 ? ' low' : '') + '">' + pct + '%</td></tr>';
  });
  h += '</table>';
  
  var erros = answers.filter(function(a){ return !a.ok; }).map(function(a){ return a.q; });
  if(erros.length > 0){
    h += '<h2>Tópicos a Revisar (' + erros.length + ' falhas)</h2><ul>';
    erros.forEach(function(err){
      h += '<li><strong>' + err.sec + ' (' + err.ref + '):</strong> ' + err.tema + '</li>';
    });
    h += '</ul>';
  } else {
    h += '<div class="note"><strong>Desempenho Impecável:</strong> Domínio integral de todas as etapas, curvas de secagem e classificações de feno.</div>';
  }
  
  h += '<div style="margin-top:20px">';
  h += '<button class="sec" id="rs">Reiniciar Simulado Completo</button>';
  if(erros.length > 0){
    h += '<button class="main" id="re">Refazer Somente os Erros (' + erros.length + ')</button>';
  }
  h += '</div>';
  
  app.innerHTML = h;
  document.getElementById('rs').onclick = function(){ start(Q); };
  if(erros.length > 0){
    document.getElementById('re').onclick = function(){ start(erros); };
  }
}

start(Q);
</script>
