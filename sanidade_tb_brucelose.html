var ORDER = ["B1","A1","D1","G1","C1","F1","H1","E1","B2","E2","H2","C2","A2","G2","F2","D2","G3","D3","B3","E3","F3","A3","C3","H3","C4","F4","A4","D4","H4","B4","E4","G4","A5","H5","D5","B5","C5","E5"];
var app=document.getElementById('app');
var queue,pos,answers,t0,cur,locked,optList,famSeen,FAMQ;
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x}return a}
function start(ids){queue=ids;pos=0;answers=[];t0=Date.now();famSeen={};FAMQ={};ids.forEach(function(id){FAMQ[Q[id].t]=(FAMQ[Q[id].t]||0)+1});render()}
function render(){
  if(pos>=queue.length){return finish()}
  var id=queue[pos],q=Q[id];cur=id;locked=false;
  var opts=[{x:q.ok,ok:true,why:''}].concat(q.er.map(function(e){return{x:e[0],ok:false,why:e[1]}}));
  optList=shuffle(opts);
  var L='ABCD';
  var h='<h1>Tuberculose e Brucelose</h1><p class="sub">Etiologia, diagnóstico, espécies, biosseguridade e PNCEBT (slides 1 a 40)</p>';
  h+='<div class="meta"><span>Questão '+(pos+1)+' de '+queue.length+'</span><span>'+answers.filter(function(a){return a.ok}).length+' acertos</span></div>';
  h+='<div class="bar"><i style="width:'+(pos/queue.length*100)+'%"></i></div>';
  h+='<p class="stem">'+q.q+'</p><div id="opts">';
  optList.forEach(function(o,i){h+='<button class="opt" data-i="'+i+'"><b>'+L[i]+'</b><span>'+o.x+'</span></button>'});
  h+='</div><div id="fb"></div><p class="hint">Atalhos: 1–4 escolhem a alternativa; Enter avança.</p>';
  app.innerHTML=h;
  Array.prototype.forEach.call(app.querySelectorAll('.opt'),function(b){b.onclick=function(){pick(+b.getAttribute('data-i'))}});
}
function pick(i){
  if(locked||!optList[i])return;locked=true;
  var q=Q[cur],o=optList[i];
  var btns=app.querySelectorAll('.opt');
  Array.prototype.forEach.call(btns,function(b,k){b.disabled=true;if(optList[k].ok)b.classList.add('ok');else if(k===i)b.classList.add('ko')});
  famSeen[q.t]=(famSeen[q.t]||0)+1;
  var nth=famSeen[q.t];
  answers.push({id:cur,t:q.t,ok:o.ok,ang:q.ang});
  var th=T[q.t];
  var f='<div class="fb"><p class="h '+(o.ok?'ok':'ko')+'">'+(o.ok?'Correto.':'Errado.')+'</p>';
  f+='<p><em>Tema:</em> '+th.nome+' <em>('+q.ang+')</em></p>';
  f+='<p><em>Pista que entregou:</em> '+q.pista+'</p>';
  f+='<p><em>Núcleo:</em> '+th.nucleo+'</p>';
  if(!o.ok)f+='<p><em>Por que a sua escolha está errada:</em> '+o.why+'</p>';
  f+='<p><em>Se fosse o outro tema:</em> '+q.outro+'</p>';
  f+='<p><em>Referência:</em> '+q.ref+'</p>';
  f+='<p><em>Progresso da família:</em> '+th.nome.split(' - ')[0]+' - '+nth+' de '+FAMQ[q.t]+'</p>';
  f+='<button class="main" id="nx">'+(pos+1>=queue.length?'Ver fechamento':'Próxima')+'</button></div>';
  document.getElementById('fb').innerHTML=f;
  document.getElementById('nx').onclick=next;
  document.getElementById('nx').focus();
}
function next(){pos++;render();window.scrollTo(0,0)}
document.addEventListener('keydown',function(e){
  if(!queue||pos>=queue.length)return;
  if(!locked&&e.key>='1'&&e.key<='4'){pick(+e.key-1)}
  else if(locked&&e.key==='Enter'){e.preventDefault();next()}
});
function fmt(ms){var s=Math.round(ms/1000);return Math.floor(s/60)+'min '+('0'+(s%60)).slice(-2)+'s'}
function finish(){
  var tot=answers.length,ac=answers.filter(function(a){return a.ok}).length;
  var by={};answers.forEach(function(a){by[a.t]=by[a.t]||{n:0,k:0};by[a.t].n++;if(a.ok)by[a.t].k++});
  var h='<h1>Fechamento - Tuberculose e Brucelose</h1><p class="sub">Defesa sanitária e PNCEBT (40 slides)</p>';
  h+='<div class="score">'+(ac/tot*10).toFixed(1)+' / 10</div><p>'+ac+' de '+tot+' acertos · tempo '+fmt(Date.now()-t0)+'</p>';
  h+='<h2>Mapa</h2><table><tr><th>Tema</th><th>Núcleo</th><th>Pistas</th><th>Confusão</th><th>Acertos</th></tr>';
  Object.keys(T).forEach(function(k){
    if(!by[k])return;var p=by[k].k/by[k].n;
    h+='<tr><td>'+T[k].nome+'</td><td>'+T[k].nucleo+'</td><td>'+T[k].pistas+'</td><td>'+T[k].conf+'</td><td class="p'+(p<0.7?' low':'')+'">'+by[k].k+'/'+by[k].n+'</td></tr>';
  });
  h+='</table>';
  h+='<h2>Pontes</h2><ul>';
  answers.filter(function(a){return a.ang==='Ponte'}).forEach(function(a){h+='<li>'+Q[a.id].ponte+' '+(a.ok?'(acertou)':'(errou)')+'</li>'});
  h+='</ul>';
  var soltos=Object.keys(by).filter(function(k){return by[k].k/by[k].n<0.7});
  h+='<h2>Pontos soltos (abaixo de 70%)</h2>';
  h+=soltos.length?'<ul>'+soltos.map(function(k){return'<li>'+T[k].nome+' - '+by[k].k+'/'+by[k].n+'</li>'}).join('')+'</ul>':'<p>Nenhum tema abaixo de 70%.</p>';
  h+='<p class="note">Famílias menores que 5 por peso dos slides: F (Brucelose geral, 4q sem Ponte isolada — comparada em H5) e G (Foco/BCG, 4q sem Ponte isolada — comparada em H5).</p>';
  var erros=answers.filter(function(a){return!a.ok}).map(function(a){return a.id});
  h+='<button class="sec" id="rs">Recomeçar</button>';
  if(erros.length)h+='<button class="main" id="re">Refazer só os erros ('+erros.length+')</button>';
  if(soltos.length)h+='<p class="hint">Para uma rodada extra com ângulos novos dos temas abaixo de 70%, peça ao Ultron: este arquivo só repete as questões existentes.</p>';
  app.innerHTML=h;
  document.getElementById('rs').onclick=function(){start(ORDER)};
  if(erros.length)document.getElementById('re').onclick=function(){start(erros)};
}
start(ORDER);
</script>
